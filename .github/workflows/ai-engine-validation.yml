name: AI engine validation
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/verify-local-inference.cjs', 'scripts/benchmark-ai.cjs', 'scripts/evaluate-product-suitability.cjs', 'scripts/prepare-engine-legacy.sh', '.github/workflows/ai-engine-validation.yml']
  workflow_dispatch:
    inputs:
      verify_public_inference:
        description: 'One explicitly requested anonymous availability observation (not a deterministic gate)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ai-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      RUN_MARIADB_INTEGRATION: 'true'
      MARIADB_TEST_ALLOW_RESET: 'true'
      FREELMAPI_METRICS_DB: ':memory:'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: scripts/start-ci-mariadb.sh
      - run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Install browser for full export regression
        run: npm exec --prefix backend -- playwright install --with-deps chromium
      - name: Initialize disposable schema
        run: |
          node - <<'NODE'
          const db = require('./backend/database/mysql');
          db.initializeSchema().then(result => { if (!result.success) throw new Error(result.error); return db.closePool(); }).catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Full backend regression (not targeted-only)
        run: npm --prefix backend test
      - name: Production security audit
        if: always()
        run: npm --prefix backend audit --omit=dev
      - name: Stop disposable database
        if: always()
        run: docker rm -f "$CI_MARIADB_CONTAINER"
  real-local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Obtain licensed small model and official inference server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-models"
          curl --fail --location --retry 2 --max-time 180 \
            https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf \
            -o "$RUNNER_TEMP/ai-models/model.gguf"
          sha256sum "$RUNNER_TEMP/ai-models/model.gguf" >> "$GITHUB_STEP_SUMMARY"
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --detach --cpus 2 --name ai-engine-local --publish 127.0.0.1:8081:8080 \
            --volume "$RUNNER_TEMP/ai-models:/models:ro" ghcr.io/ggml-org/llama.cpp:server \
            -m /models/model.gguf -c 2048 -t 2 --host 0.0.0.0 --port 8080
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/health; then exit 0; fi
            sleep 2
          done
          docker logs ai-engine-local
          exit 1
      - name: Actual catalog -> router -> model inference
        run: node scripts/verify-local-inference.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deterministic benchmark harness regression
        run: node --test tests/ai-benchmark.test.cjs
      - name: Measure synthetic quality and streaming speed on the actual loaded model
        run: node scripts/benchmark-ai.cjs
      - name: Start disposable MariaDB for authenticated full-app E2E
        run: scripts/start-ci-mariadb.sh
      - name: Install full-app browser dependencies
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Prepare immutable historical frontend for matched browser comparison
        run: bash scripts/prepare-engine-legacy.sh
      - name: Initialize full-app E2E schema and ephemeral verifier
        env:
          NODE_ENV: test
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "TEST_AUTH_HMAC_SECRET=$secret" >> "$GITHUB_ENV"
          node - <<'NODE'
          const db = require('./backend/database/mysql');
          db.initializeSchema().then(result => { if (!result.success) throw new Error(result.error); return db.closePool(); }).catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Authenticated full-app Playwright with real MariaDB and model inference
        env:
          NODE_ENV: test
          CI: 'true'
          LLAMACPP_ENABLED: 'true'
          LLAMACPP_BASE_URL: http://127.0.0.1:8081/v1
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4000,http://localhost:4000,http://127.0.0.1:4001,http://localhost:4001
        run: npm exec --prefix frontend -- playwright test --config=frontend/tests/engine-authenticated.config.ts
      - name: Preserve actual benchmark records and responsive screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-local-benchmark-and-browser
          retention-days: 14
          path: |
            artifacts/ai-engine/*.json
            frontend/test-results/engine-authenticated/**/*.png
            frontend/test-results/engine-authenticated/**/comparison.json
      - name: Stop full-app disposable database
        if: always()
        run: docker rm -f "$CI_MARIADB_CONTAINER" || true
      - name: Stop model server
        if: always()
        run: docker rm -f ai-engine-local

  real-public-anonymous-inference:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_inference }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Community capacity is external. A failed attempt stays visibly failed, never certifies a provider.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Actual official anonymous API inference (one bounded submission)
        run: node scripts/verify-public-anonymous-inference.cjs
      - name: Publish sanitized evidence
        if: success()
        run: cat artifacts/ai-engine/public-anonymous-inference.json >> "$GITHUB_STEP_SUMMARY"

  real-ollama-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOCAL_INFERENCE_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Start official local CPU server and obtain a distinct small model
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker image inspect ollama/ollama:latest --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --detach --cpus 2 --name ai-engine-ollama --publish 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags; then break; fi
            sleep 2
          done
          docker exec ai-engine-ollama ollama pull qwen2.5:0.5b
          docker exec ai-engine-ollama ollama pull qwen2.5:1.5b
          curl --fail --silent http://127.0.0.1:11434/api/tags >> "$GITHUB_STEP_SUMMARY"
      - name: Actual Ollama discovery and canonical Balanced inference
        run: node scripts/verify-local-inference.cjs
      - name: Comparable synthetic quality and streaming speed measurements
        run: node scripts/benchmark-ai.cjs
      - name: Obtain a stronger model when runner resources permit (one attempt)
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai-engine
          docker exec ai-engine-ollama ollama stop qwen2.5:0.5b
          docker exec ai-engine-ollama ollama stop qwen2.5:1.5b
          available_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
          disk_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$available_kb" -ge 5000000 ] && [ "$disk_kb" -ge 8000000 ]; then
            if docker exec ai-engine-ollama ollama pull qwen3:4b; then
              printf '{"model":"qwen3:4b","status":"obtained","access":"self-hosted"}\n' > artifacts/ai-engine/stronger-model-status.json
              curl --fail --silent http://127.0.0.1:11434/api/show -d '{"model":"qwen3:4b"}' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '{"model":"qwen3:4b","status":"pull-failed","inferenceVerified":false}\n' > artifacts/ai-engine/stronger-model-status.json
              echo '::warning::Stronger model pull failed; no operation or quality claimed'
            fi
          else
            printf '{"model":"qwen3:4b","status":"resource-ineligible","inferenceVerified":false}\n' > artifacts/ai-engine/stronger-model-status.json
            echo "::notice::Stronger model ineligible: available memory ${available_kb}KiB, disk ${disk_kb}KiB"
          fi
          curl --fail --silent http://127.0.0.1:11434/api/tags >> "$GITHUB_STEP_SUMMARY"
      - name: Product workload screening at realistic output budgets
        run: node scripts/evaluate-product-suitability.cjs
      - name: Preserve complete Ollama benchmark records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-ollama-benchmark
          path: artifacts/ai-engine/*.json
          retention-days: 14
      - name: Stop model server
        if: always()
        run: docker rm -f ai-engine-ollama
