# Quality gate — the checks a pull request must pass before it can merge.
#
# Every step here is a command the completion pack cites, run in the same order a
# reviewer would run it. Nothing is `|| true`, nothing is allowed to fail: a gate that can
# be ignored is a comment.
#
# Deliberate choices:
#   - The database-backed suites are NOT run here. They need a disposable MariaDB and the
#     test-only identity verifier, and a CI job that half-runs them would produce a green
#     tick that means less than the honest "not executed" in TEST-EVIDENCE.md. The steps
#     below cover every suite that runs without a database.
#   - Coverage thresholds live in `backend/.c8rc.json` and are enforced by `check-coverage`
#     at the end of `test:coverage`, so they cannot drift from the command in the docs.
#   - The frontend gates are static (tsc, oxlint, the two audits). Playwright needs a
#     browser download and a database-backed webServer; it is a separate, opt-in job.
name: quality-gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend · types, tests, coverage, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci --include=optional

      - name: Syntax check every source file
        working-directory: backend
        run: |
          # A require-time crash is the most expensive failure to discover later; this
          # catches a stray syntax error in any file, including ones no test imports.
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -n1 node --check

      - name: Smoke (in-process, no database)
        working-directory: backend
        run: npm run smoke

      - name: Tiers (contract, characterisation, chaos, performance, load, query-plan, migration, integration)
        working-directory: backend
        run: |
          NODE_ENV=test node --test --test-concurrency=1 --test-force-exit \
            test/api-contract.test.js \
            test/characterisation.test.js \
            test/chaos-resilience.test.js \
            test/performance-budget.test.js \
            test/migrations-integrity.test.js \
            test/runtime-limits.test.js \
            test/config-api.test.js \
            test/config-registry.test.js \
            test/config-registry-guards.test.js \
            test/config-validators.test.js \
            test/config-edge-coverage.test.js \
            test/authz-visibility-matrix.test.js \
            test/route-manifest.test.js \
            test/admin-rbac-api.test.js \
            test/admin-rbac-store.test.js \
            test/admin-rbac-administration.test.js \
            test/admin-rbac-edge-coverage.test.js \
            test/admin-rbac-resolver.test.js \
            test/admin-rbac-contract.test.js \
            test/admin-target-authority.test.js \
            test/setting-classification.test.js \
            test/security.test.js \
            test/database-ownership-completeness.test.js \
            test/mariadb-query-budget.test.js \
            test/query-plan-regression.test.js \
            test/load-concurrency.test.js \
            test/load-sustained.test.js \
            test/migration-drill-contract.test.js \
            test/degraded-endpoint-semantics.test.js \
            test/characterisation-divergences.test.js

      # The thresholds here and in backend/.c8rc.json are the same numbers; both are
      # deliberately above the 10/10 bar's floor (90 statements / 85 branches) so a small
      # regression fails the gate instead of eroding it. Proven to fail, not just to pass:
      # raising them to 99 exits 1 on the same data.
      - name: Coverage gate (95 statements / 95 lines / 90 functions / 85 branches)
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/coverage-summary.json
            backend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: frontend · types, lint, contrast, target size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci --include=optional

      - name: Type check (project references)
        working-directory: frontend
        run: npx tsc -b

      - name: Type check (strict — admin plane and its models)
        working-directory: frontend
        run: npm run typecheck:strict

      - name: Component tests (jsdom, no browser)
        working-directory: frontend
        run: npm run test:unit:coverage

      - name: Lint (zero warnings allowed)
        working-directory: frontend
        run: npm run lint

      - name: UX audit — touch targets, text size, focus rings, widths
        working-directory: frontend
        run: npm run ux:audit

      - name: Contrast audit — WCAG 2.2 AA on the 16 rendered pairs
        working-directory: frontend
        run: npm run a11y:contrast

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-evidence
          path: |
            frontend/ux-audit.json
            frontend/contrast-audit.json
          if-no-files-found: warn
          retention-days: 14

  migration-drill:
    name: migration · forward, rollback, re-apply on MariaDB (opt-in, destructive)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The only job that proves the rollback chain works on a real engine
    # (test/migration-rollback-drill.test.js) and that hot queries EXPLAIN to an
    # index (test/query-plan-regression.test.js EXPLAIN layer). Destructive
    # against a disposable service container — never a shared database.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: resumepilot_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: resumepilot_ci
      RUN_MARIADB_INTEGRATION: 'true'
      MARIADB_TEST_ALLOW_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (backend)
        working-directory: backend
        run: npm ci --include=optional
      - name: Rollback drill (forward → down chain → re-apply)
        working-directory: backend
        run: node --test --test-concurrency=1 --test-force-exit test/migration-rollback-drill.test.js
      - name: Migration gate (checksums, idempotency, integration invariants)
        working-directory: backend
        run: node --test --test-concurrency=1 --test-force-exit test/mariadb-migration-gate.test.js
      - name: Query-plan EXPLAIN layer (no hot query may full-scan)
        working-directory: backend
        run: node --test --test-concurrency=1 --test-force-exit test/query-plan-regression.test.js
      - name: Query-plan drill (per-query row budgets, refuses anything but SELECT)
        working-directory: backend
        run: npm run query-plan:drill
      # The dynamic drill is the long form of the rollback test above: every migration
      # forward twice (idempotency), backwards twice (reversibility), then a schema
      # checksum comparison. test/migration-drill-contract.test.js (no database needed)
      # proves the drill refuses a production-looking database name before it runs here.
      - name: Migration drill (forward ×2, backward ×2, checksum)
        working-directory: backend
        run: npm run migration:drill

  lighthouse:
    name: performance · Lighthouse budgets per page class (opt-in, needs a browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Like the e2e job, it needs a browser download. It runs on demand and on
    # `dev`; the budgets in frontend/budgets/per-page-class.json are the gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build (frontend)
        working-directory: frontend
        run: |
          npm ci --include=optional
          npx playwright install --with-deps chromium
          npm run build
      - name: Lighthouse budgets (LCP < 2.5s, CLS < 0.1, TBT < 200ms, mobile 4G)
        working-directory: frontend
        run: npm run perf:budgets
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: frontend/lighthouse-results
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: e2e · browser gates (opt-in, needs a database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not part of the required check set: it needs a disposable MariaDB and a Chromium
    # download. It runs on demand and on `dev`, where the database service is available.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: resumepilot_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: resumepilot_test
      ALLOW_TEST_AUTH_VERIFIER: 'true'
      TEST_AUTH_HMAC_SECRET: ci-only-not-a-production-secret-32chars
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (frontend + browsers)
        working-directory: frontend
        run: |
          npm ci --include=optional
          npx playwright install --with-deps chromium
      - name: Apply migrations to the disposable database
        working-directory: backend
        run: for f in database/migrations/*.sql; do case "$f" in *.down.sql) continue;; esac; mysql -h 127.0.0.1 -uroot -proot resumepilot_test < "$f"; done
      - name: Accessibility, device classes, keyboard, visual baseline, vitals
        working-directory: frontend
        run: npx playwright test tests/admin-console-ux.spec.ts tests/accessibility.spec.ts
      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 7
