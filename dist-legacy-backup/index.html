    <!-- Critical Pre-Paint Styling: Zero Theme FOUC & Zero Skip-Link Flash -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        margin: 0;
        min-height: 100vh;
        background-color: #f4f5f9;
        color: #10121a;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body {
          background-color: #0d0f16 !important;
          color: #f2f4fb !important;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html.dark,
      html.dark body {
        background-color: #0d0f16 !important;
        color: #f2f4fb !important;
        color-scheme: dark;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #f4f5f9 !important;
        color: #10121a !important;
        color-scheme: light;
      }
      .skip-link {
        position: absolute;
        top: -100px;
        left: 0.75rem;
        z-index: 10000;
        padding: 0.5rem 0.85rem;
        background: #0f172a;
        color: #ffffff;
        border-radius: 0.35rem;
        text-decoration: none;
        font-size: 0.875rem;
      }
      .skip-link:focus {
        top: 0.75rem;
      }
      /*
       * DIR-064: the skip-link is a keyboard affordance for SCREEN media only.
       * cuba-print.css neutralises `position: absolute` under @media print, which
       * used to drop this link into normal flow at the very top of page 1 and
       * print it as a stray "Skip to main content" banner — pushing the entire
       * resume onto page 2 (the "blank first page" defect). Suppress it on paper
       * while leaving the on-screen focus behaviour (top: 0.75rem above) intact.
       */
      @media print {
        .skip-link {
          display: none !important;
        }
      }
    </style>
