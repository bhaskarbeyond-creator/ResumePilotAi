# Certification CI pipeline.
#
# NOTE: kept in docs/ci-templates (like codeql.yml / security-ci.yml) rather
# than .github/workflows because the automation credential does not carry the
# GitHub `workflows` permission. To activate, copy to .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-unit:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Frontend product suites
        run: npm run test:product
      - name: Frontend security suites
        run: node --test tests/security-static.test.mjs tests/secret-scanner-efficacy.test.mjs tests/xss.test.mjs tests/mfa-static.test.mjs

  backend-integration:
    name: Backend integration (MariaDB authoritative)
    runs-on: ubuntu-24.04
    env:
      MARIADB_CI_IMAGE: mariadb@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83 # 11.4.12
      RUN_MARIADB_INTEGRATION: "true"
      MARIADB_TEST_ALLOW_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MariaDB with ephemeral credentials
        run: scripts/start-ci-mariadb.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Backend test suite (against live MariaDB)
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm test
      - name: Stop isolated MariaDB
        if: always()
        run: docker rm -f "$CI_MARIADB_CONTAINER" >/dev/null 2>&1 || true

  zero-firestore-certification:
    name: Zero-Firestore production certification
    runs-on: ubuntu-24.04
    needs: [build-lint-unit, backend-integration]
    env:
      MARIADB_CI_IMAGE: mariadb@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83 # 11.4.12
      RUN_MARIADB_INTEGRATION: "true"
      RUN_MARIADB_OUTBOX_CERTIFICATION: "true"
      RUN_MARIADB_BACKUP_RESTORE_DRILL: "true"
      MARIADB_TEST_ALLOW_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MariaDB with ephemeral credentials
        run: scripts/start-ci-mariadb.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Initialize isolated certification schema
        env:
          NODE_ENV: test
        run: |
          node - <<'NODE'
          const database = require('./backend/database/mysql');
          database.initializeSchema()
            .then((result) => {
              if (!result.success) throw new Error(result.error || 'schema initialization failed');
              return database.closePool();
            })
            .catch((error) => { console.error(error.message); process.exit(1); });
          NODE
      - name: Static zero-Firestore certification (census + structure)
        run: npm run certify:firestore-zero
      - name: Runtime certification (Firestore OFF boot, MariaDB outage, outbox, backup/restore)
        run: npm run certify:runtime
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence
          path: |
            docs/firestore-dependency-census.json
            .arena/evidence/
          if-no-files-found: ignore
      - name: Stop isolated MariaDB
        if: always()
        run: docker rm -f "$CI_MARIADB_CONTAINER" >/dev/null 2>&1 || true

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Production dependency audit (blocks on high/critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high
