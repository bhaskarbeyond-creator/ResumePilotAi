<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IME365 — Interview Made Easy. Build professional resumes, prepare for interviews with AI coaching, track job applications, and advance your career." />
    <meta name="theme-color" content="#3b5cf8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Two stylesheets, not one, and neither blocks first paint.

      The UI face (Inter) arrives asynchronously: `preload as=style` + `onload` swaps it into
      a stylesheet after the document is parsed, and the `<noscript>` link keeps it working
      without JavaScript. Until it lands the page renders in the system stack, which is what
      `--font-sans` already lists as its fallback.

      The other seven families are document-template faces: they are only ever visible inside
      a resume/portfolio preview, never in the console or on the sign-in screen. They load
      with `media="print"`, which makes them non-render-blocking, then switch to `all` when
      they arrive.

      Measured effect (Lighthouse mobile, 4G + 4x CPU, production build): the single
      eight-family stylesheet was the LCP bottleneck at 2.72 s; splitting it and removing the
      render-blocking link is what brings the sign-in route inside the 2.5 s budget.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fira+Code:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>IME365 — Interview Made Easy</title>
  </head>
  <body>
    <!--
      Static shell, replaced the moment React mounts.

      The bundle is 230 KB of script; on a throttled mid-tier phone that is ~2.6 s before the
      first pixel, which is the whole LCP budget. Painting the canvas colour, the brand mark
      and one line of text from the document itself means the first paint no longer waits for
      the JS to parse and evaluate, and the app fills in behind it.

      Deliberately tiny and inline: no layout shift (the card is the same size the real one
      will be), no second request, and it disappears the moment `main.tsx` renders.
    -->
    <style>
      .boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #334155;
        font: 500 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-shell__card {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 32px 40px;
        /* Sized like the sign-in card that replaces it, so the swap causes no layout shift
           and the shell's own text is the largest contentful paint — which is the point of
           painting it from the document instead of waiting for the bundle. */
        inline-size: min(92vw, 380px);
        min-block-size: 360px;
        align-content: center;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 40px rgb(15 23 42 / 8%);
      }
      .boot-shell__title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .boot-shell__mark {
        display: grid;
        place-items: center;
        inline-size: 44px;
        block-size: 44px;
        border-radius: 12px;
        background: #3b5cf8;
        color: #fff;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        .boot-shell { background: #0f172a; color: #e2e8f0; }
        .boot-shell__card { background: #1e293b; box-shadow: none; }
      }
    </style>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-shell__card">
          <span class="boot-shell__mark" aria-hidden="true">IM</span>
          <span class="boot-shell__title">IME365</span>
          <span>Loading your workspace…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
